<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo Especial para Sahoo 💐</title>
  <!-- Importamos Three.js para renderizar 3D en la web -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls para permitir girar e interactuar con el ramo -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #2c1a32 0%, #0d0614 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Interfaz y controles */
    #ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #ffffff;
      pointer-events: none;
      z-index: 10;
      width: 90%;
      max-width: 600px;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 2.2rem;
      color: #ff9ebb;
      text-shadow: 0 0 12px rgba(255, 158, 187, 0.6);
      font-weight: 300;
      letter-spacing: 2px;
    }

    p.subtitle {
      margin: 0;
      font-size: 1rem;
      color: #d1b3e0;
      font-style: italic;
    }

    .controls-panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.95rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      background: rgba(255, 158, 187, 0.3);
      border-color: #ff9ebb;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 158, 187, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    /* Estilo del Audio HTML5 oculta */
    #bgMusic {
      display: none;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h1>Para Sahoo ❤️</h1>
    <p class="subtitle">Arrastra para girar el ramo | Usa el rodillo para acercar</p>
  </div>

  <div class="controls-panel">
    <button id="musicBtn" onclick="toggleMusic()">🎵 Música: Wicked Game</button>
  </div>

  <!-- ================================================================= -->
  <!-- PARTE DE LA MÚSICA: Debe llamarse 'wicked-game.mp3' en tu carpeta -->
  <!-- ================================================================= -->
  <audio id="bgMusic" loop src="wicked-game.mp3"></audio>

  <div id="canvas-container"></div>

  <script>
    // --- CONFIGURACIÓN TRES.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d0614, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;
    controls.minDistance = 5;
    controls.maxDistance = 25;

    // --- ILUMINACIÓN CÁLIDA Y ROMÁNTICA ---
    const ambientLight = new THREE.AmbientLight(0xfff0f5, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
    mainLight.position.set(5, 10, 7);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const pinkSpot = new THREE.PointLight(0xff69b4, 1.2, 20);
    pinkSpot.position.set(-5, 2, -2);
    scene.add(pinkSpot);

    const purpleSpot = new THREE.PointLight(0x8a2be2, 1, 20);
    purpleSpot.position.set(5, -2, 2);
    scene.add(purpleSpot);

    // --- CONSTRUCCIÓN DEL RAMO DE FLORES 3D ---
    const bouquetGroup = new THREE.Group();

    // Materiales
    const stemMaterial = new THREE.MeshLambertMaterial({ color: 0x2e7d32, roughness: 0.8 });
    const leafMaterial = new THREE.MeshLambertMaterial({ color: 0x388e3c, side: THREE.DoubleSide });
    const wrapMaterial = new THREE.MeshStandardMaterial({ 
      color: 0xf5eff6, 
      roughness: 0.4, 
      metalness: 0.1, 
      side: THREE.DoubleSide 
    });
    const ribbonMaterial = new THREE.MeshStandardMaterial({ color: 0xe91e63, roughness: 0.3 });

    // Función para crear una Rosa detallada
    function createRose(colorHex) {
      const roseGroup = new THREE.Group();
      const petalMaterial = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.5,
        metalness: 0.1
      });

      // Centro de la rosa
      const centerGeo = new THREE.SphereGeometry(0.25, 16, 16);
      const center = new THREE.Mesh(centerGeo, petalMaterial);
      center.scale.set(1, 1.3, 1);
      roseGroup.add(center);

      // Capas de pétalos
      const petalLayers = [
        { count: 4, size: 0.3, radius: 0.2, rot: 0.4 },
        { count: 6, size: 0.4, radius: 0.35, rot: 0.6 },
        { count: 8, size: 0.5, radius: 0.5, rot: 0.8 }
      ];

      petalLayers.forEach(layer => {
        for (let i = 0; i < layer.count; i++) {
          const angle = (i / layer.count) * Math.PI * 2;
          const petalGeo = new THREE.SphereGeometry(layer.size, 16, 16, 0, Math.PI);
          const petal = new THREE.Mesh(petalGeo, petalMaterial);

          petal.position.x = Math.cos(angle) * layer.radius;
          petal.position.z = Math.sin(angle) * layer.radius;
          petal.rotation.y = -angle + Math.PI / 2;
          petal.rotation.x = layer.rot;
          petal.scale.set(0.8, 1.2, 0.3);

          roseGroup.add(petal);
        }
      });

      return roseGroup;
    }

    // Tallo y Flor individual
    function createFlowerStem(colorHex, angleX, angleZ, height) {
      const stemGroup = new THREE.Group();

      // Tallo curvo levemente
      const stemGeo = new THREE.CylinderGeometry(0.04, 0.05, height, 8);
      const stem = new THREE.Mesh(stemGeo, stemMaterial);
      stem.position.y = height / 2;
      stemGroup.add(stem);

      // Flor en la punta
      const rose = createRose(colorHex);
      rose.position.y = height;
      rose.rotation.x = Math.random() * 0.2;
      stemGroup.add(rose);

      // Hoja lateral
      const leafGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const leaf = new THREE.Mesh(leafGeo, leafMaterial);
      leaf.scale.set(0.1, 0.8, 1);
      leaf.position.set(0.1, height * 0.5, 0);
      leaf.rotation.z = -Math.PI / 4;
      stemGroup.add(leaf);

      stemGroup.rotation.x = angleX;
      stemGroup.rotation.z = angleZ;

      return stemGroup;
    }

    // Generar arreglo de flores (rosas rojas, rosadas y blancas)
    const flowerColors = [0xd81b60, 0xff4081, 0xf48fb1, 0xff80ab, 0xffffff];
    const totalFlowers = 21;

    for (let i = 0; i < totalFlowers; i++) {
      const phi = Math.acos(-1 + (2 * i) / totalFlowers);
      const theta = Math.sqrt(totalFlowers * Math.PI) * phi;

      const angleX = (Math.sin(theta) * 0.35);
      const angleZ = (Math.cos(theta) * 0.35);
      const color = flowerColors[i % flowerColors.length];
      const stemLength = 4.5 + Math.random() * 0.5;

      const flower = createFlowerStem(color, angleX, angleZ, stemLength);
      bouquetGroup.add(flower);
    }

    // Envoltorio elegante (Cono)
    const wrapGeo = new THREE.ConeGeometry(2.3, 5.5, 32, 1, true);
    const wrap = new THREE.Mesh(wrapGeo, wrapMaterial);
    wrap.position.y = 1.8;
    wrap.rotation.x = Math.PI;
    bouquetGroup.add(wrap);

    // Listón / Moño decorativo
    const ribbonGeo = new THREE.TorusGeometry(0.7, 0.08, 16, 32);
    const ribbon = new THREE.Mesh(ribbonGeo, ribbonMaterial);
    ribbon.position.y = 1.8;
    ribbon.rotation.x = Math.PI / 2;
    bouquetGroup.add(ribbon);

    bouquetGroup.position.y = -2;
    scene.add(bouquetGroup);

    // --- PARTICULAS MAGICAS DE FONDO (LUCIÉRNAGAS) ---
    const particlesGeo = new THREE.BufferGeometry();
    const particleCount = 200;
    const posArray = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 20;
    }

    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMat = new THREE.PointsMaterial({
      size: 0.06,
      color: 0xffb7c5,
      transparent: true,
      opacity: 0.8
    });

    const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particlesMesh);

    // --- LÓGICA DE CONTROL DE MÚSICA ---
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        musicBtn.innerHTML = "🎵 Música: Pausada";
        musicBtn.style.background = "rgba(255, 255, 255, 0.12)";
      } else {
        music.play().then(() => {
          musicBtn.innerHTML = "🎶 Reproduciendo Wicked Game";
          musicBtn.style.background = "rgba(255, 158, 187, 0.4)";
        }).catch(err => {
          alert("Asegúrate de haber guardado el archivo 'wicked-game.mp3' en la misma carpeta.");
        });
      }
      isPlaying = !isPlaying;
    }

    // --- BUCLE DE ANIMACIÓN Y RENDERIZADO ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotación suave automática
      bouquetGroup.rotation.y += 0.003;
      particlesMesh.rotation.y += 0.0005;

      controls.update();
      renderer.render(scene, camera);
    }

    // Ajustar pantalla al redimensionar ventana
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
